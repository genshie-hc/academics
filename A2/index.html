<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShieFlix: My Favorite Movies &amp; Series</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { background-color: #0b0b0c; color: #e8e4dc; }
        section { scroll-margin-top: 70px; }

        .top-nav { background: linear-gradient(#000000, rgba(11, 11, 12, 0.92)); }
        .logo { color: #d3293a; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
        .logo:hover { color: #d3293a; }
        .top-nav .nav-link { color: #c9c5bb; font-size: 0.9rem; }
        .top-nav .nav-link:hover { color: #ffffff; }
        .navbar-toggler { border-color: #3a3a3a; }
        .navbar-toggler-icon { filter: invert(1); }

        .hero {
            min-height: 78vh;
            display: flex;
            align-items: center;
            background-color: #0b0b0c;
            background-image: linear-gradient(90deg, rgba(11,11,12,0.96) 15%, rgba(11,11,12,0.45) 60%, rgba(11,11,12,0.15) 100%),
                              linear-gradient(0deg, #0b0b0c 0%, rgba(11,11,12,0) 30%),
                              url("https://image.tmdb.org/t/p/w1280/xJHokMbljvjADYdit5fK5VQsXEG.jpg");
            background-size: cover;
            background-position: center;
        }
        .hero-content { max-width: 520px; }
        .hero-label { color: #d3293a; font-weight: 700; letter-spacing: 3px; font-size: 0.8rem; }
        .hero-title { font-size: clamp(2.5rem, 7vw, 4.5rem); font-weight: 800; color: #ffffff; }
        .hero-meta { color: #b8b2a4; font-size: 0.9rem; }
        .btn-red { background-color: #b3202f; border-color: #b3202f; color: #ffffff; font-weight: 600; }
        .btn-red:hover { background-color: #d3293a; border-color: #d3293a; color: #ffffff; }
        .btn-ghost { background-color: rgba(255,255,255,0.12); border-color: transparent; color: #ffffff; font-weight: 600; }
        .btn-ghost:hover { background-color: rgba(255,255,255,0.22); color: #ffffff; }

        .row-heading { font-size: 1.3rem; font-weight: 600; color: #ffffff; margin-bottom: 4px; }
        .row-heading::before { content: ""; display: inline-block; width: 4px; height: 1.1rem; background-color: #b3202f; margin-right: 10px; vertical-align: -2px; }
        .poster-row { display: flex; gap: 16px; overflow-x: auto; padding: 14px 4px 20px 4px; scrollbar-width: thin; scrollbar-color: #3a3a3a transparent; }

        .poster-tile { position: relative; flex: 0 0 auto; width: 170px; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; cursor: pointer; background-color: #1c1c1e; transition: transform 0.25s, box-shadow 0.25s; }
        .poster-tile.large { width: 240px; }
        .poster-tile:hover { transform: scale(1.06); box-shadow: 0 6px 18px rgba(0,0,0,0.6); z-index: 2; }
        .poster-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .poster-info { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 10px 10px 10px; background: linear-gradient(0deg, rgba(0,0,0,0.92), rgba(0,0,0,0)); transition: background 0.25s; }
        .poster-title { font-size: 0.9rem; font-weight: 600; color: #ffffff; margin: 0; }
        .poster-extra { max-height: 0; opacity: 0; overflow: hidden; font-size: 0.75rem; color: #c9c5bb; transition: max-height 0.25s, opacity 0.25s; }
        .poster-tile:hover .poster-info { background: linear-gradient(0deg, rgba(0,0,0,0.97) 60%, rgba(0,0,0,0.55)); }
        .poster-tile:hover .poster-extra { max-height: 80px; opacity: 1; margin-top: 4px; }
        .poster-link { color: #d3293a; font-weight: 600; }
        @media (hover: none) {
            .poster-extra { max-height: 80px; opacity: 1; margin-top: 4px; }
        }
        @media (min-width: 992px) {
            .poster-tile { width: 190px; }
            .poster-tile.large { width: 270px; }
        }

        .collection { background-color: #141416; border: 1px solid #2a2a2c; border-radius: 10px; overflow: hidden; }
        .collection-img { width: 100%; height: 100%; max-height: 420px; object-fit: cover; }
        .collection-label { color: #d3293a; font-weight: 700; letter-spacing: 3px; font-size: 0.8rem; }
        .footer-text { color: #7d7a72; font-size: 0.85rem; border-top: 1px solid #1f1f21; }

        .modal-content { background-color: #141416; color: #e8e4dc; border: 1px solid #2a2a2c; }
        .modal-title { color: #ffffff; }
        .modal-poster { width: 100%; border-radius: 8px; }
        .detail-list { list-style: none; padding-left: 0; color: #b8b2a4; }
        .detail-list strong { color: #e8e4dc; }
        .badge-type { background-color: #7a1f2b; }
        .badge-genre { background-color: #2c2c2e; color: #d8d2c4; border: 1px solid #3a3a3a; }
    </style>
</head>

        var exploring = [9, 3, 4, 11, 1];

        for (var i = 0; i < exploring.length; i++) {

        // Series row, movies row, and one detail modal for every title
        for (var i = 0; i < favorites.length; i++) {
